<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>English Command Center V3.0</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --sub: #64748b;
      --border: #e2e8f0; --blue: #2563eb; --blue-soft: #eff6ff;
      --green: #10b981; --red: #ef4444; --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #111827; --text: #f8fafc; --sub: #94a3b8;
        --border: #1e293b; --blue-soft: #1e3a8a;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: Inter, "Noto Sans TC", sans-serif;
      background-color: var(--bg); color: var(--text); transition: background 0.3s;
    }
    .app { width: 100%; max-width: 430px; margin: 0 auto; min-height: 100vh; padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; text-align: center; margin: 20px 0 5px; }
    .subline { text-align: center; font-size: 12px; color: var(--sub); margin-bottom: 20px; }
    
    /* 網格系統 */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { border: none; border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 14px; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active { transform: scale(0.96); }
    .btn-blue { background: var(--blue); color: white; }
    .btn-soft { background: var(--blue-soft); color: var(--blue); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    
    /* 列表項目 */
    .item { border-bottom: 1px solid var(--border); padding: 14px 0; }
    .item:last-child { border-bottom: none; }
    .item-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .word { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .translation { font-size: 14px; color: var(--sub); line-height: 1.4; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--blue-soft); color: var(--blue); font-weight: 800; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .chip { font-size: 11px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .chip.active-hard { border-color: var(--red); color: var(--red); background: #fef2f2; }
    .chip.active-known { border-color: var(--green); color: var(--green); background: #ecfdf5; }
    
    .hidden { display: none; }
    textarea { width: 100%; min-height: 150px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 12px; font-size: 14px; outline: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="app">
    <div id="homeView">
      <h1>English Command Center</h1>
      <div class="subline" id="versionInfo">V3.0 ｜ Spaced Repetition Active</div>
      
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <b id="todayFire">🔥 0 連續天數</b>
          <span id="progressPct">0%</span>
        </div>
        <div class="grid">
          <button class="btn btn-soft" onclick="showView('vocab')">單字庫 <span id="countWords">0</span></button>
          <button class="btn btn-soft" onclick="showView('fsi')">FSI 訓練 <span id="countFsi">0</span></button>
        </div>
      </div>

      <div class="grid">
        <div class="card" onclick="showView('analyze')">
          <div style="font-size:24px; margin-bottom:8px;">📩</div>
          <b>會議/Email 分析</b>
          <p style="font-size:11px; color:var(--sub);">提取前 3000 字術語</p>
        </div>
        <div class="card" onclick="showView('import')">
          <div style="font-size:24px; margin-bottom:8px;">📥</div>
          <b>批次匯入</b>
          <p style="font-size:11px; color:var(--sub);">支援單字自動補全</p>
        </div>
      </div>
      <button class="btn btn-ghost" style="width:100%; margin-top:10px;" onclick="exportData()">💾 導出備份 (含時間戳記)</button>
    </div>

    <div id="vocabView" class="hidden">
      <div class="toolbar">
        <button class="btn btn-ghost" onclick="showView('home')">← 返回</button>
        <b style="font-size:18px;">📘 單字庫</b>
        <button class="btn btn-ghost" onclick="toggleShowKnown()" id="toggleKnownBtn">👁️ 顯示全部</button>
      </div>
      <div class="card" id="wordList"></div>
    </div>

    <div id="analyzeView" class="hidden">
      <div class="toolbar"><button class="btn btn-ghost" onclick="showView('home')">← 返回</button><b>會議分析</b></div>
      <textarea id="rawInput" placeholder="在此貼上 Email 或 會議文字稿 (最多 3000 字)..."></textarea>
      <button class="btn btn-blue" style="width:100%; margin-top:12px;" onclick="processText()">開始智慧提取</button>
      <div id="analysisResult" class="card" style="margin-top:15px; display:none;"></div>
    </div>

    <div id="importView" class="hidden">
      <div class="toolbar"><button class="btn btn-ghost" onclick="showView('home')">← 返回</button><b>批次匯入</b></div>
      <textarea id="importInput" placeholder="格式：英文 | 中文 (可只填英文)"></textarea>
      <button class="btn btn-blue" style="width:100%; margin-top:12px;" onclick="batchImport()">匯入單字</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'ecc_v3_data';
    const UNFREEZE_DAYS = 7; //

    // 本地內建字典 (範例)
    const localDict = {
      "capacity": "產能 | n.", "yield": "良率 | n.", "audit": "稽核 | n.",
      "bottleneck": "瓶頸 | n.", "shipment": "出貨 | n.", "allocate": "分配 | v."
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      words: [], fsi: [], showKnown: false, lastExport: null
    };

    function save() { 
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateCounts();
    }

    // 自動解凍邏輯
    function checkUnfreeze() {
      const now = Date.now();
      state.words.forEach(w => {
        if (w.known && w.lastDone) {
          const daysPast = (now - w.lastDone) / (1000 * 60 * 60 * 24);
          if (daysPast >= UNFREEZE_DAYS) {
            w.known = false; // 7天後自動復原
          }
        }
      });
      save();
    }

    // 加權隨機排序
    function getWeightedList(list) {
      let filtered = state.showKnown ? list : list.filter(i => !i.known);
      return filtered.map(item => ({
        item,
        score: (item.hard ? 10 : 1) * Math.random() // 🔥 困難加權 10 倍
      })).sort((a, b) => b.score - a.score).map(x => x.item);
    }

    function renderWords() {
      const list = getWeightedList(state.words);
      const container = document.getElementById('wordList');
      container.innerHTML = list.length ? '' : '<p style="text-align:center; color:var(--sub);">暫時沒有需要複習的單字</p>';
      list.forEach(w => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-head">
            <div>
              <div class="word">${w.en}</div>
              <div class="translation">${w.zh || '待補中文'}</div>
            </div>
            <button class="chip" onclick="speak('${w.en}')">🔊</button>
          </div>
          <div class="actions">
            <button class="chip ${w.hard ? 'active-hard' : ''}" onclick="toggleStatus('${w.id}', 'hard')">🔥 困難</button>
            <button class="chip ${w.known ? 'active-known' : ''}" onclick="toggleStatus('${w.id}', 'known')">✅ 熟悉</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleStatus(id, key) {
      const w = state.words.find(x => x.id === id);
      w[key] = !w[key];
      if (key === 'known') w.lastDone = w.known ? Date.now() : null; // 紀錄時間戳記
      save();
      renderWords();
    }

    function batchImport() {
      const lines = document.getElementById('importInput').value.split('\n');
      lines.forEach(line => {
        let [en, zh] = line.split('|').map(s => s.trim());
        if (!en) return;
        en = en.toLowerCase();
        if (state.words.some(w => w.en === en)) return;
        
        // 自動補全邏輯
        const auto = localDict[en] || "";
        state.words.push({
          id: Math.random().toString(36).substr(2, 9),
          en, zh: zh || auto, hard: false, known: false, lastDone: null
        });
      });
      document.getElementById('importInput').value = '';
      alert('匯入完成！');
      save();
      showView('home');
    }

    function processText() {
      const text = document.getElementById('rawInput').value.slice(0, 3000); // 3000 字上限
      const words = [...new Set(text.match(/[a-zA-Z]{4,}/g))].map(w => w.toLowerCase());
      const resultDiv = document.getElementById('analysisResult');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<b>提取建議單字：</b><br>' + words.slice(0, 10).join(', ');
    }

    function speak(text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }

    function showView(v) {
      ['home','vocab','analyze','import'].forEach(id => document.getElementById(id+'View').classList.add('hidden'));
      document.getElementById(v+'View').classList.remove('hidden');
      if(v === 'vocab') renderWords();
    }

    function toggleShowKnown() {
      state.showKnown = !state.showKnown;
      document.getElementById('toggleKnownBtn').innerText = state.showKnown ? '👁️ 隱藏熟悉' : '👁️ 顯示全部';
      renderWords();
    }

    function updateCounts() {
      document.getElementById('countWords').innerText = state.words.filter(w => !w.known).length;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ECC_V3_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    // 初始化
    checkUnfreeze();
    updateCounts();
  </script>
</body>
</html>
